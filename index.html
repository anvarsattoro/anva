<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Анвар · Жизнь</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #1A1A1F;
  --ink-soft: #4C4A52;
  --ink-faint: #8A857E;
  --paper: #F7F4EF;
  --card: #FCFAF6;
  --line: #E6DFD3;
  --bordeaux: #8E2C2C;
  --pos: #2E7D5B;
  --warn: #C0881E;
  --crit: #C0392B;
  --pos-bg: #EBF5F0;
  --warn-bg: #FDF5E6;
  --crit-bg: #FBEFEC;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', sans-serif;
  background: #E8E3DA;
  color: var(--ink);
  min-height: 100vh;
  padding: 24px 16px 48px;
  -webkit-font-smoothing: antialiased;
}

.page { max-width: 760px; margin: 0 auto; }

.header {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  padding: 0 4px 16px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 28px;
}
.header-title {
  font-family: 'Manrope', sans-serif;
  font-weight: 800;
  font-size: 22px;
  letter-spacing: -.01em;
}
.header-title .dot { color: var(--bordeaux); }
.header-sub {
  font-size: 12px;
  color: var(--ink-faint);
  letter-spacing: .04em;
}

.section-label {
  font-family: 'Manrope', sans-serif;
  font-weight: 700;
  font-size: 11px;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--bordeaux);
  margin-bottom: 12px;
}

/* Habit chips row (Today) */
.chips {
  display: flex;
  gap: 12px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.chip {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex: 1;
  min-width: 180px;
}
.chip.ok   { border-top: 3px solid var(--pos);  background: var(--pos-bg); }
.chip.warn { border-top: 3px solid var(--warn); background: var(--warn-bg); }
.chip.fail { border-top: 3px solid var(--crit); background: var(--crit-bg); }

.chip-icon { font-size: 22px; }
.chip-main {
  font-family: 'Manrope', sans-serif;
  font-weight: 800;
  font-size: 20px;
  line-height: 1;
  color: var(--ink);
}
.chip-sub {
  font-size: 12px;
  color: var(--ink-faint);
  margin-top: 2px;
}

/* Action bar */
.action-card {
  background: var(--ink);
  border-radius: 14px;
  padding: 14px 20px;
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 28px;
}
.action-arrow {
  font-family: 'Manrope', sans-serif;
  font-weight: 700;
  font-size: 18px;
  color: var(--bordeaux);
  flex-shrink: 0;
}
.action-text {
  font-size: 14px;
  color: #F7F4EF;
  font-weight: 500;
}

/* Two-column bottom */
.bottom-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
@media (max-width: 600px) {
  .bottom-grid { grid-template-columns: 1fr; }
  .chips { flex-direction: column; }
}

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 20px 22px;
}

/* Metric rows */
.metric {
  padding: 11px 0;
  border-bottom: 1px solid var(--line);
}
.metric:last-child { border-bottom: none; padding-bottom: 0; }
.metric:first-child { padding-top: 0; }

.metric-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 6px;
}
.metric-name {
  font-size: 13px;
  color: var(--ink-soft);
}
.metric-value {
  font-family: 'Manrope', sans-serif;
  font-weight: 700;
  font-size: 15px;
  color: var(--ink);
  white-space: nowrap;
}

/* Progress bar */
.bar-track {
  height: 6px;
  background: var(--line);
  border-radius: 99px;
  overflow: hidden;
}
.bar-fill {
  height: 100%;
  border-radius: 99px;
  background: var(--bordeaux);
}
.bar-fill.good { background: var(--pos); }
.bar-fill.warn { background: var(--warn); }

.bar-footer {
  display: flex;
  justify-content: space-between;
  margin-top: 4px;
}
.bar-pct { font-size: 11px; color: var(--ink-faint); }

.loading { text-align: center; padding: 80px 0; color: var(--ink-faint); font-size: 14px; }
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <div class="header-title">АНВАР <span class="dot">·</span> ЖИЗНЬ</div>
    <div class="header-sub" id="updated">загрузка...</div>
  </div>
  <div id="content"><div class="loading">Загрузка данных...</div></div>
</div>

<script>
function bar(cur, goal, variant) {
  const pct = goal > 0 ? Math.min(100, Math.round(cur / goal * 100)) : 0;
  const cls = variant || (pct >= 100 ? 'good' : '');
  return `
    <div class="bar-track"><div class="bar-fill ${cls}" style="width:${pct}%"></div></div>
    <div class="bar-footer">
      <span class="bar-pct">${cur} / ${goal}</span>
      <span class="bar-pct">${pct}%</span>
    </div>`;
}

function rub(n) {
  if (n == null) return '—';
  return n >= 1000 ? Math.round(n / 1000) + 'к ₽' : n + ' ₽';
}

function render(d) {
  const t = d.today;
  const m = d.month;
  const y = d.year;

  // Chip: трезвость
  const alc = t.alcohol_free_days;
  const alcChip = `<div class="chip ok">
    <span class="chip-icon">🍺</span>
    <div>
      <div class="chip-main">${alc != null ? alc + ' дн' : '—'}</div>
      <div class="chip-sub">трезвость</div>
    </div>
  </div>`;

  // Chip: сон
  const sleepOk = t.sleep_on_time;
  const lateMins = t.sleep_late_min || 0;
  const sleepClass = sleepOk ? 'ok' : 'fail';
  const sleepMark = sleepOk ? '✅' : '❌';
  const sleepSub = sleepOk
    ? `лёг ${t.sleep_start || '—'}`
    : `лёг ${t.sleep_start || '—'}, +${lateMins} мин`;
  const sleepChip = `<div class="chip ${sleepClass}">
    <span class="chip-icon">🌙</span>
    <div>
      <div class="chip-main">${sleepMark}</div>
      <div class="chip-sub">${sleepSub}</div>
    </div>
  </div>`;

  // Chip: тренировка
  const trained = t.trained;
  const trainChip = `<div class="chip ${trained ? 'ok' : 'warn'}">
    <span class="chip-icon">🏋</span>
    <div>
      <div class="chip-main">${trained ? '✅' : '—'}</div>
      <div class="chip-sub">${trained ? 'тренировка' : 'нет тренировки'}</div>
    </div>
  </div>`;

  // Month
  const mDays = m.days_elapsed || 1;
  const monthHtml = `
    <div class="metric">
      <div class="metric-header">
        <span class="metric-name">🍺 Трезвость</span>
        <span class="metric-value">${m.sobriety_days} / ${mDays} дн</span>
      </div>
      ${bar(m.sobriety_days, mDays, 'good')}
    </div>
    <div class="metric">
      <div class="metric-header">
        <span class="metric-name">🌙 Сон вовремя</span>
        <span class="metric-value">${m.sleep_on_time_days} / ${mDays} дн</span>
      </div>
      ${bar(m.sleep_on_time_days, mDays, m.sleep_on_time_days / mDays >= 0.7 ? 'good' : 'warn')}
    </div>
    <div class="metric">
      <div class="metric-header">
        <span class="metric-name">🏋 Тренировки</span>
        <span class="metric-value">${m.workouts} / ${m.workouts_goal}</span>
      </div>
      ${bar(m.workouts, m.workouts_goal)}
    </div>`;

  // Year
  const savedRub = y.saved_rub || 0;
  const savingsGoal = y.savings_goal || 480000;
  const yearHtml = `
    <div class="metric">
      <div class="metric-header">
        <span class="metric-name">🍺 Трезвость</span>
        <span class="metric-value">${y.sobriety_days} / ${y.sobriety_goal} дн</span>
      </div>
      ${bar(y.sobriety_days, y.sobriety_goal, 'good')}
    </div>
    <div class="metric">
      <div class="metric-header">
        <span class="metric-name">🏋 Интенсивные</span>
        <span class="metric-value">${y.intensive_count} / ${y.intensive_goal}</span>
      </div>
      ${bar(y.intensive_count, y.intensive_goal)}
    </div>
    <div class="metric">
      <div class="metric-header">
        <span class="metric-name">💰 Накоплено</span>
        <span class="metric-value">${rub(savedRub)} / ${rub(savingsGoal)}</span>
      </div>
      ${bar(savedRub, savingsGoal)}
    </div>`;

  document.getElementById('content').innerHTML = `
    <div class="section-label">Сегодня</div>
    <div class="chips">${alcChip}${sleepChip}${trainChip}</div>
    <div class="action-card">
      <span class="action-arrow">→</span>
      <span class="action-text">${t.action || ''}</span>
    </div>
    <div class="bottom-grid">
      <div class="card">
        <div class="section-label">${m.name}</div>
        ${monthHtml}
      </div>
      <div class="card">
        <div class="section-label">Год 2026</div>
        ${yearHtml}
      </div>
    </div>
  `;

  const gen = new Date(d.generated_at);
  const opts = { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Moscow' };
  document.getElementById('updated').textContent = 'обновлено ' + gen.toLocaleString('ru-RU', opts);
}

fetch('data.json?v=' + Date.now())
  .then(r => r.json())
  .then(render)
  .catch(() => {
    document.getElementById('content').innerHTML = '<div class="loading">Ошибка загрузки данных</div>';
  });
</script>
</body>
</html>
