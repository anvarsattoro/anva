<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Анвар · Жизнь</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Анвар · Жизнь">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --ink:       #1A1A1F;
  --ink-soft:  #4C4A52;
  --ink-faint: #8A857E;
  --paper:     #F7F4EF;
  --card:      #FCFAF6;
  --line:      #E6DFD3;
  --bg:        #E2DDD5;
  --bordeaux:  #8E2C2C;
  --pos:       #2A7A52;
  --pos-bg:    #EAF5EF;
  --warn:      #B87A18;
  --warn-bg:   #FDF3E0;
  --crit:      #B83232;
  --crit-bg:   #FAECEC;
  --card-shadow: 0 1px 3px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.07);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  padding: 28px 16px 60px;
  -webkit-font-smoothing: antialiased;
}

.page { max-width: 820px; margin: 0 auto; }

/* ── Header ── */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 28px;
  padding: 0 2px;
}
.header-title {
  font-family: 'Manrope', sans-serif;
  font-weight: 800;
  font-size: 20px;
  letter-spacing: .04em;
  color: var(--ink);
}
.header-title .dot { color: var(--bordeaux); }
.header-sub {
  font-size: 11px;
  color: var(--ink-faint);
  letter-spacing: .05em;
}

/* ── Section label ── */
.section-label {
  font-family: 'Manrope', sans-serif;
  font-weight: 700;
  font-size: 10px;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--bordeaux);
  margin-bottom: 10px;
}

/* ── Card base ── */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 18px;
  box-shadow: var(--card-shadow);
}

/* ── WHOOP compact strip ── */
.whoop-strip {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  margin-bottom: 12px;
}
.whoop-strip .card { border-radius: 0; border-right: none; }
.whoop-strip .card:first-child { border-radius: 18px 0 0 18px; }
.whoop-strip .card:last-child  { border-radius: 0 18px 18px 0; border-right: 1px solid var(--line); }

.whoop-cell {
  padding: 14px 18px;
}
.whoop-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin-bottom: 5px;
}
.whoop-value {
  font-family: 'Manrope', sans-serif;
  font-weight: 800;
  font-size: 28px;
  line-height: 1;
  letter-spacing: -.02em;
  color: var(--ink);
  display: flex;
  align-items: baseline;
  gap: 3px;
}
.whoop-value .unit {
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-soft);
}
.whoop-sub {
  font-size: 11px;
  color: var(--ink-faint);
  margin-top: 3px;
}
.whoop-target {
  font-size: 10px;
  color: var(--ink-faint);
  margin-top: 5px;
  display: flex;
  align-items: center;
  gap: 5px;
}
.whoop-target .tval,
.tval {
  font-family: 'Manrope', sans-serif;
  font-weight: 700;
  font-size: 10px;
}
.tval.met,
.whoop-target .tval.met   { color: var(--pos); }
.tval.unmet,
.whoop-target .tval.unmet { color: var(--crit); }
.whoop-target .tarrow {
  font-size: 9px;
  opacity: .5;
}
.rec-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  margin-right: 6px;
  margin-bottom: 2px;
  vertical-align: middle;
}
.rec-dot.good { background: var(--pos); }
.rec-dot.warn { background: var(--warn); }
.rec-dot.crit { background: var(--crit); }

/* ── Habit chips ── */
.chips {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 12px;
}
/* ── Mobile: iPhone 14 Pro Max (430px) — compact horizontal layout ── */
@media (max-width: 500px) {
  body { padding: 18px 12px 48px; }

  .header { margin-bottom: 20px; }
  .header-title { font-size: 17px; letter-spacing: .03em; }
  .header-sub { font-size: 10px; }

  /* WHOOP strip: keep 3 cols, shrink everything */
  .whoop-cell { padding: 10px 10px 10px 12px; }
  .whoop-label { font-size: 8.5px; letter-spacing: .06em; }
  .whoop-value { font-size: 21px; }
  .whoop-value .unit { font-size: 11px; }
  .whoop-sub { font-size: 9.5px; margin-top: 2px; }
  .whoop-target { font-size: 9px; margin-top: 4px; gap: 3px; }
  .whoop-target .tval { font-size: 9px; }
  .rec-dot { width: 7px; height: 7px; margin-right: 4px; }

  /* Habit chips: keep 3 cols, tighter */
  .chips { gap: 7px; }
  .chip { padding: 12px 8px; gap: 8px; border-left-width: 3px; }
  .chip-icon { font-size: 18px; }
  .chip-main { font-size: 17px; }
  .chip-sub { font-size: 10px; margin-top: 2px; }

  /* Action bar */
  .action-bar { padding: 12px 16px; gap: 10px; margin-bottom: 20px; }
  .action-text { font-size: 12.5px; }

  /* Charts */
  .sleep-chart-card { padding: 14px 14px; }
  .sleep-bars { height: 52px; gap: 5px; }
  .sleep-bar-hours { font-size: 8.5px; }
  .sleep-bar-label { font-size: 9px; }

  /* Bottom grid: 2 cols but compact */
  .bottom-grid { gap: 8px; margin-bottom: 12px; }
  .section-card { padding: 14px 10px 12px; }
  .metric { padding: 8px 0; }
  .metric-name { font-size: 11px; }
  .metric-value { font-size: 13px; }

  /* Rings compact */
  .ring-chart { width: 60px; height: 60px; }
  .ring-pct { font-size: 11px; }
  .ring-label { font-size: 10px; }
  .ring-sub { font-size: 9px; }

  /* Calendar */
  .cal-card { padding: 14px 12px; }
  .cal-dot { width: 14px; height: 6px; }
  .cal-num { font-size: 8px; }
  .cal-legend { gap: 10px; flex-wrap: wrap; }
  .cal-legend-item { font-size: 10px; }

  /* Goals */
  .goals-card { padding: 14px 14px; }
  .goal-item { padding: 9px 0; gap: 10px; }
  .goal-icon { font-size: 16px; width: 22px; }
  .goal-text { font-size: 12px; }

  .section-label { font-size: 9.5px; margin-bottom: 8px; }
  .spacer { height: 10px; }
  .card { border-radius: 14px; }
}

.chip {
  padding: 16px 18px;
  display: flex;
  align-items: center;
  gap: 14px;
  border-left: 3px solid var(--line);
}
.chip.ok   { border-left-color: var(--pos);  background: var(--pos-bg); }
.chip.warn { border-left-color: var(--warn); background: var(--warn-bg); }
.chip.fail { border-left-color: var(--crit); background: var(--crit-bg); }
.chip-icon { font-size: 24px; flex-shrink: 0; }
.chip-main {
  font-family: 'Manrope', sans-serif;
  font-weight: 800;
  font-size: 22px;
  line-height: 1;
  color: var(--ink);
}
.chip-sub  {
  font-size: 11px;
  color: var(--ink-faint);
  margin-top: 3px;
  line-height: 1.4;
}

/* ── Action bar ── */
.action-bar {
  background: var(--ink);
  border-radius: 16px;
  padding: 16px 20px;
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 20px;
  box-shadow: 0 6px 24px rgba(26,26,31,0.22);
}
.action-arrow {
  font-family: 'Manrope', sans-serif;
  font-weight: 700;
  font-size: 18px;
  color: var(--bordeaux);
  flex-shrink: 0;
}
.action-text {
  font-size: 14px;
  color: #F0ECE5;
  font-weight: 500;
  line-height: 1.45;
}

/* ── Sleep week chart ── */
.sleep-chart-card {
  padding: 20px 22px;
  margin-bottom: 16px;
}
.sleep-bars {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  height: 64px;
  margin: 12px 0 6px;
}
.sleep-bar-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  height: 100%;
  justify-content: flex-end;
}
.sleep-bar {
  width: 100%;
  border-radius: 5px 5px 0 0;
  min-height: 4px;
  transition: height .3s ease;
}
.sleep-bar.ok    { background: var(--pos); }
.sleep-bar.warn  { background: var(--warn); }
.sleep-bar.late  { background: var(--crit); opacity: .8; }
.sleep-bar.nodata { background: var(--line); }
.sleep-bar-label {
  font-size: 10px;
  color: var(--ink-faint);
  font-weight: 500;
}
.sleep-bar-hours {
  font-size: 9px;
  color: var(--ink-faint);
  height: 12px;
  line-height: 12px;
}

/* ── Month + Year grid ── */
.bottom-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-bottom: 16px;
}
@media (max-width: 600px) { .bottom-grid { grid-template-columns: 1fr; } }

.section-card {
  padding: 18px 16px 16px;
  border-left: 3px solid var(--bordeaux);
  border-radius: 0 18px 18px 0;
}

/* ── Rings ── */
.rings-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}
.rings-grid-2x2 {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 6px;
}
.ring-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  padding: 4px 0;
}
.ring-chart {
  position: relative;
  width: 72px;
  height: 72px;
}
.ring-chart svg { width: 100%; height: 100%; }
.ring-inner {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
}
.ring-pct {
  font-family: 'Manrope', sans-serif;
  font-weight: 800;
  font-size: 13px;
  color: var(--ink);
  letter-spacing: -.03em;
  line-height: 1;
}
.ring-icon { font-size: 15px; line-height: 1; }
.ring-label {
  font-size: 11px;
  color: var(--ink-soft);
  font-weight: 500;
  text-align: center;
  line-height: 1.3;
}
.ring-sub {
  font-size: 9.5px;
  color: var(--ink-faint);
  text-align: center;
  line-height: 1.3;
}

/* ── Metric rows ── */
.metric {
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
}
.metric:last-child { border-bottom: none; padding-bottom: 0; }
.metric:first-child { padding-top: 0; }
.metric-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 6px;
}
.metric-name  { font-size: 12px; color: var(--ink-soft); }
.metric-value {
  font-family: 'Manrope', sans-serif;
  font-weight: 700;
  font-size: 14px;
  color: var(--ink);
  white-space: nowrap;
}

/* ── Progress bar ── */
.bar-track {
  height: 5px;
  background: var(--line);
  border-radius: 99px;
  overflow: hidden;
}
.bar-fill {
  height: 100%;
  border-radius: 99px;
  background: var(--bordeaux);
}
.bar-fill.good { background: var(--pos); }
.bar-fill.over { background: var(--pos); }
.bar-footer {
  display: flex;
  justify-content: space-between;
  margin-top: 4px;
}
.bar-pct { font-size: 10px; color: var(--ink-faint); }

/* ── Streak calendar ── */
.cal-card {
  padding: 20px 22px;
  margin-bottom: 16px;
}
.cal-legend {
  display: flex;
  gap: 16px;
  margin-bottom: 12px;
}
.cal-legend-item {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  color: var(--ink-faint);
}
.legend-dot {
  width: 10px; height: 10px;
  border-radius: 2px;
  flex-shrink: 0;
}
.cal-weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  margin-bottom: 4px;
}
.cal-wd {
  text-align: center;
  font-size: 9px;
  font-weight: 600;
  letter-spacing: .06em;
  color: var(--ink-faint);
  text-transform: uppercase;
}
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
}
.cal-cell {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 2px 0;
}
.cal-empty { /* blank day offset */ }
.cal-num {
  font-size: 9px;
  color: var(--ink-faint);
  font-variant-numeric: tabular-nums;
  margin-bottom: 1px;
}
.cal-dots {
  display: flex;
  flex-direction: column;
  gap: 2px;
  width: 100%;
  align-items: center;
}
.cal-dot {
  width: 18px;
  height: 7px;
  border-radius: 2px;
}
.dot-ok   { background: var(--pos); }
.dot-fail { background: var(--crit); opacity: .75; }
.dot-na   { background: var(--line); }

/* ── Life goals ── */
.goals-card {
  padding: 20px 22px;
  margin-bottom: 0;
}
.goals-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 0;
}
.goal-item {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 11px 0;
  border-bottom: 1px solid var(--line);
}
.goal-item:first-child { padding-top: 0; }
.goal-item:last-child  { border-bottom: none; padding-bottom: 0; }
.goal-icon { font-size: 18px; flex-shrink: 0; width: 28px; text-align: center; }
.goal-text { font-size: 13px; color: var(--ink-soft); line-height: 1.4; }
.goal-text strong { color: var(--ink); font-weight: 600; }

/* ── Misc ── */
.spacer { height: 16px; }
.loading { text-align: center; padding: 80px 0; color: var(--ink-faint); font-size: 14px; }

/* ── Tab navigation ── */
.tab-bar {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 8px 0 12px;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  position: sticky;
  top: 0;
  background: var(--bg);
  z-index: 50;
}
.tab-bar::-webkit-scrollbar { display: none; }
.tab-pill {
  flex-shrink: 0;
  padding: 5px 13px;
  border-radius: 20px;
  background: var(--card);
  border: 1.5px solid var(--line);
  font-size: 12px;
  font-weight: 600;
  font-family: inherit;
  color: var(--ink-soft);
  cursor: pointer;
  white-space: nowrap;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  outline: none;
}
.tab-pill.active {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}
.tab-section { scroll-margin-top: 52px; }
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <div class="header-title">АНВАР <span class="dot">·</span> ЖИЗНЬ</div>
    <div class="header-sub" id="updated">загрузка...</div>
  </div>
  <div id="content"><div class="loading">Загрузка данных...</div></div>
</div>

<script>
const DAY_ABBR = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const WEEKDAYS = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];

function bar(cur, goal, variant) {
  const raw = goal > 0 ? cur / goal : 0;
  const pct = Math.min(100, Math.round(raw * 100));
  const cls = variant || (raw >= 1 ? 'over' : '');
  return `<div class="bar-track"><div class="bar-fill ${cls}" style="width:${pct}%"></div></div>
    <div class="bar-footer">
      <span class="bar-pct">${cur} / ${goal}</span>
      <span class="bar-pct">${pct}%</span>
    </div>`;
}

function rub(n) {
  if (n == null) return '—';
  return n >= 1000 ? Math.round(n / 1000) + 'к ₽' : n + ' ₽';
}

function recClass(r) {
  if (r == null) return '';
  return r >= 67 ? 'good' : r >= 34 ? 'warn' : 'crit';
}

function sleepH(h) {
  if (h == null) return '—';
  const hrs = Math.floor(h);
  const min = Math.round((h - hrs) * 60);
  return min > 0 ? `${hrs}ч ${min}м` : `${hrs}ч`;
}

function dot(cls) {
  return `<div class="cal-dot ${cls}"></div>`;
}

function ringColor(pct) {
  if (pct >= 90) return '#2A7A52';   // насыщенный зелёный
  if (pct >= 75) return '#4EA843';   // зелёный
  if (pct >= 55) return '#86B830';   // жёлто-зелёный
  if (pct >= 35) return '#C8A028';   // жёлтый
  if (pct >= 15) return '#D4701C';   // оранжевый
  return '#8E2C2C';                   // бордо
}

function ring(cur, goal, icon, label, sub) {
  const pct = goal > 0 ? Math.min(100, Math.round(cur / goal * 100)) : 0;
  const fill = pct.toFixed(1);
  const empty = (100 - pct).toFixed(1);
  const color = ringColor(pct);
  return `<div class="ring-wrap">
    <div class="ring-chart">
      <svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
        <circle cx="18" cy="18" r="15.9" fill="none" stroke="var(--line)" stroke-width="3.8"/>
        <circle cx="18" cy="18" r="15.9" fill="none" stroke="${color}"
          stroke-width="3.8" stroke-linecap="round"
          stroke-dasharray="${fill} ${empty}" stroke-dashoffset="25"/>
      </svg>
      <div class="ring-inner">
        <div class="ring-pct">${pct}%</div>
      </div>
    </div>
    <div class="ring-label">${icon} ${label}</div>
    <div class="ring-sub">${sub}</div>
  </div>`;
}

function render(d) {
  const t   = d.today;
  const m   = d.month;
  const y   = d.year;
  const sw  = d.sleep_week || [];
  const rw  = d.recovery_week || [];
  const mw  = d.mood_week || [];
  const cal = d.month_calendar || [];
  const fin = d.finances || {};

  /* ── Trend arrows ── */
  function trendArrow(current, previous, lowerBetter) {
    if (current == null || previous == null) return '';
    const delta = current - previous;
    if (Math.abs(delta) < 0.5) return '';
    const better = lowerBetter ? delta < 0 : delta > 0;
    const color = better ? 'var(--pos)' : 'var(--crit)';
    const sym = delta > 0 ? '↑' : '↓';
    return `<span style="font-size:10px;color:${color};font-weight:700;margin-left:4px">${sym}${Math.abs(Math.round(delta))}</span>`;
  }

  const recYesterday  = rw.length >= 2 ? rw[rw.length - 2].score : null;
  const sleepYest     = sw.length >= 2 ? sw[sw.length - 2].hours : null;
  const hrvYesterday  = rw.length >= 2 ? rw[rw.length - 2].hrv   : null;

  /* ── WHOOP strip ── */
  const rc = recClass(t.recovery);
  const REC_TARGET   = 67;
  const SLEEP_TARGET = 7.5;
  const RHR_TARGET   = 52;

  function target(actual, goal, fmtFn, lowerIsBetter) {
    if (actual == null) return '';
    const met = lowerIsBetter ? actual <= goal : actual >= goal;
    const cls = met ? 'met' : 'unmet';
    return `<div class="whoop-target">
      <span>цель</span>
      <span class="tval ${cls}">${fmtFn(goal)}</span>
    </div>`;
  }

  const whoopStrip = `
    <div class="whoop-strip">
      <div class="card">
        <div class="whoop-cell">
          <div class="whoop-label">Recovery</div>
          <div class="whoop-value">
            <span class="rec-dot ${rc}"></span>
            ${t.recovery != null ? Math.round(t.recovery) : '—'}<span class="unit">%</span>
            ${trendArrow(t.recovery, recYesterday, false)}
          </div>
          ${target(t.recovery, REC_TARGET, v => v + '%', false)}
        </div>
      </div>
      <div class="card">
        <div class="whoop-cell">
          <div class="whoop-label">Сон</div>
          <div class="whoop-value">
            ${sleepH(t.sleep_hours)}
            ${trendArrow(t.sleep_hours, sleepYest, false)}
          </div>
          <div class="whoop-sub">лёг ${t.sleep_start || '—'}</div>
          ${target(t.sleep_hours, SLEEP_TARGET, sleepH, false)}
        </div>
      </div>
      <div class="card">
        <div class="whoop-cell">
          <div class="whoop-label">HRV · ЧСС покоя</div>
          <div class="whoop-value">
            ${t.hrv_ms != null ? Math.round(t.hrv_ms) : '—'}<span class="unit">мс</span>
            ${trendArrow(t.hrv_ms, hrvYesterday, false)}
          </div>
          ${(() => {
            const rhrVal = t.rhr != null ? Math.round(t.rhr) : null;
            const rhrMet = rhrVal != null && rhrVal <= RHR_TARGET;
            const rhrCls = rhrVal != null ? (rhrMet ? 'met' : 'unmet') : '';

    'Силовая': '🏋', 'Бодибилдинг': '🏋', 'Функционалка': '💪', 'HIIT': '⚡', 'Кросс-кантри': '⛰️',
    'Йога': '🧘', 'Медитация': '🧘', 'Пилатес': '🤸', 'Стретч': '🤸',

  /* ── Sleep + Recovery week charts ── */

  function miniBarChart(items, topLabelFn, clsFn) {

      const maxVal = n.hours != null ? MAX_H : 100;
      const px = val != null ? Math.max(4, Math.round((Math.min(val, maxVal) / maxVal) * MAX_PX)) : 4;

      return `<div class="sleep-bar-col">
        <div class="sleep-bar-hours">${label}</div>
        <div class="sleep-bar ${cls}" style="height:${px}px"></div>

      </div>`;
    }).join('');
  }

  function sleepColor(h) {
    if (h == null) return 'var(--line)';
    if (h >= 7.5) return '#2A7A52';   // зелёный — цель
    if (h >= 7.0) return '#74B852';   // салатовый
    if (h >= 6.5) return '#B8C030';   // жёлто-зелёный

    return '#B83232';                  // красный
  }

  const sleepBars = sw.map(n => {
    const h = n.hours;
    const px = h != null ? Math.max(4, Math.round((Math.min(h, MAX_H) / MAX_H) * MAX_PX)) : 4;

      <div class="sleep-bar" style="height:${px}px;background:${bg}"></div>
      <div class="sleep-bar-label">${n.label}</div>
    </div>`;
  }).join('');

  const recBars = miniBarChart(
    rw,
    n => n.score != null ? n.score + '%' : '',
    n => n.score == null ? 'nodata' : n.score >= 67 ? 'ok' : n.score >= 34 ? 'warn' : 'late'
  );

  // Mood 7-day chart
  const MOOD_EMOJI = {1:'😞', 2:'😔', 3:'😐', 4:'😊', 5:'🌟'};

    const s = n.score;
    const px = s != null ? Math.max(4, Math.round((s / 5) * MAX_PX)) : 4;
    const bg = s != null ? moodColors[s] : 'var(--line)';
    const label = s != null ? MOOD_EMOJI[s] : '';
    return `<div class="sleep-bar-col">
      <div class="sleep-bar-hours">${label}</div>
      <div class="sleep-bar" style="height:${px}px;background:${bg}"></div>
      <div class="sleep-bar-label">${n.label}</div>
    </div>`;
  }).join('');

  const hasMoodData = mw.some(n => n.score != null);

  // Обещание вчера вечером ("ложишься до 23:10?") vs факт сегодня утром
  const sc = d.sleep_commitment;
  const scWeek = d.sleep_commitment_week || [];
  const SC_STYLE = {
    'сдержал':     { bg: 'var(--pos-bg)',  color: 'var(--pos)',  icon: '✅', dot: '#2A7A52' },
    'не сдержал':  { bg: 'var(--crit-bg)', color: 'var(--crit)', icon: '❌', dot: '#B83232' },
    'предупредил': { bg: 'var(--warn-bg)', color: 'var(--warn)', icon: '🤝', dot: '#B87A18' },
    'не ответил':  { bg: 'var(--warn-bg)', color: 'var(--ink-faint)', icon: '…', dot: 'var(--ink-faint)' },
    'нет данных':  { bg: 'var(--card)', color: 'var(--ink-faint)', icon: '', dot: 'var(--line)' },
  };
  const scWeekHtml = scWeek.length ? `<div style="display:flex;justify-content:space-between;gap:4px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)">
    ${scWeek.map(n => {
      const st = SC_STYLE[n.verdict] || SC_STYLE['нет данных'];
      return `<div style="flex:1;text-align:center">
        <div style="width:20px;height:20px;border-radius:50%;background:${st.dot};margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:10px;color:white">${st.icon}</div>
        <div style="font-size:9px;color:var(--ink-faint);margin-top:3px">${n.label}</div>
      </div>`;
    }).join('')}
  </div>` : '';
  const sleepCommitmentHtml = sc ? (() => {
    const style = SC_STYLE[sc.verdict] || SC_STYLE['нет данных'];
    const promisedText = sc.promised === 'да' ? 'обещал лечь до 23:10'
      : sc.promised === 'нет' ? 'честно предупредил, что не ляжет'
      : 'не ответил на вечерний пинг';
    return `<div class="card" style="padding:14px 16px;margin-bottom:14px;background:${style.bg};border-color:transparent">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div class="section-label" style="margin-bottom:0">Обещание вчера</div>
        <div style="font-size:12px;font-weight:800;color:${style.color}">${style.icon} ${sc.verdict}</div>
      </div>
      <div style="font-size:13px;color:var(--ink-soft);margin-top:6px">${promisedText}</div>
      <div style="font-size:12px;color:var(--ink-faint);margin-top:3px">лёг в ${sc.actual_bedtime || '—'}${sc.recovery != null ? ' · recovery ' + Math.round(sc.recovery) + '%' : ''}</div>
      ${scWeekHtml}
    </div>`;
  })() : '';

  const sleepWeekHtml = `
    <div class="card sleep-chart-card">
      <div class="section-label">Сон — 7 ночей</div>
      <div class="sleep-bars">${sleepBars}</div>

      <div style="height:14px"></div>

  // Finance card
  const incomeSources = fin.income_sources || [];
  const incomeByMonth = fin.income_by_month || [];

  const income    = fin.monthly_income || 400000;
  const expGoal   = fin.monthly_expense_goal || 300000;
  const creditRep = fin.credit_repayment || 0;
  const cats = (fin.categories || []).filter(c => c.amount > 0).sort((a, b) => b.amount - a.amount);

  const catSum  = cats.reduce((s, c) => s + c.amount, 0);
  const spent   = catSum || fin.month_expenses || 0;
  const free    = income - spent - creditRep;
  const spentPct = Math.min(100, Math.round(spent / expGoal * 100));
  const spentColor = spentPct >= 100 ? 'var(--crit)' : spentPct >= 90 ? 'var(--warn)' : 'var(--pos)';
  function catRow(c) {
    const limit = c.limit || 0;
    const pctOfLimit  = limit > 0 ? Math.round(c.amount / limit * 100) : null;
    const pctOfBudget = spent  > 0 ? Math.round(c.amount / spent * 100) : 0;
    const barW = pctOfLimit != null ? Math.min(100, pctOfLimit) : pctOfBudget;
    const barColor = pctOfLimit == null ? 'var(--ink-soft)'
      : pctOfLimit >= 100 ? 'var(--crit)'
      : pctOfLimit >= 80  ? 'var(--warn)'
      : 'var(--pos)';
    const nm = c.name.length > 18 ? c.name.slice(0, 17) + '…' : c.name;
    const amtStr = Math.round(c.amount / 1000) + 'к';
    const limStr = limit > 0 ? ' / ' + Math.round(limit / 1000) + 'к ₽' : ' ₽';
    const overTag = pctOfLimit != null && pctOfLimit > 100
      ? `<span style="font-size:10px;color:var(--crit);font-weight:700;margin-left:4px">↑${pctOfLimit}%</span>` : '';
    return `<div style="margin:7px 0">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px">

          <span style="font-size:10px;color:var(--ink-faint);margin-left:6px">${pctOfBudget}%</span>
        </div>
      </div>
      <div style="background:var(--line);border-radius:3px;height:4px">
        <div style="width:${barW}%;height:4px;background:${barColor};border-radius:3px;transition:width .3s"></div>
      </div>
    </div>`;
  }

  const TOP_N = 5;
  const topCats  = cats.slice(0, TOP_N);
  const restCats = cats.slice(TOP_N);
  const expandN  = restCats.length;
  const suffix   = expandN === 1 ? 'категория' : expandN < 5 ? 'категории' : 'категорий';
  const catRows = `
    ${topCats.map(catRow).join('')}
    ${expandN > 0 ? `

        </div>
        <div>
          <div class="whoop-label">Свободно</div>
          <div style="font-family:Manrope,sans-serif;font-weight:800;font-size:17px;color:${free>=0?'var(--pos)':'var(--crit)'}">${free>=0?'':'−'}${Math.round(Math.abs(free)/1000)}к ₽</div>
        </div>
        <div>
          <div class="whoop-label">Расходы</div>
          <div style="font-family:Manrope,sans-serif;font-weight:800;font-size:17px;color:${spentColor}">${Math.round(spent/1000)}к ₽</div>
          <div class="whoop-sub">цель ≤${Math.round(expGoal/1000)}к</div>
        </div>
        <div>
          <div class="whoop-label">💳 Долг погашен</div>
          <div style="font-family:Manrope,sans-serif;font-weight:800;font-size:17px;color:var(--warn)">${Math.round(creditRep/1000)}к ₽</div>
          <div class="whoop-sub">не расход — перевод</div>
        </div>

      <div class="bar-footer"><span class="bar-pct">${Math.round(spent/1000)}к / ${Math.round(expGoal/1000)}к ₽</span><span class="bar-pct">${spentPct}%</span></div>
      ${cats.length ? `<div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--line)">
        <div class="whoop-label" style="margin-bottom:6px">Структура расходов</div>
        ${catRows}
      </div>` : ''}
      ${incomeByMonth.length > 0 ? (() => {
        const moNames = {1:'Янв',2:'Фев',3:'Мар',4:'Апр',5:'Май',6:'Июн',7:'Июл',8:'Авг',9:'Сен',10:'Окт',11:'Ноя',12:'Дек'};
        const taxSmz = ytd.tax_smz || 0;
        const netTotal = ytdTotal - taxSmz;
        return `<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line)">
          <div class="whoop-label" style="margin-bottom:8px">Доходы ${new Date().getFullYear()} · ЗП + СМЗ</div>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:10px;text-align:center">
            <div style="padding:8px 4px;background:var(--bg);border-radius:8px">
              <div style="font-size:9px;color:var(--ink-faint);font-weight:600;letter-spacing:.6px;margin-bottom:3px">ЗП</div>
              <div style="font-family:Manrope,sans-serif;font-weight:800;font-size:15px">${Math.round((ytd.zp||0)/1000)}к</div>
            </div>
            <div style="padding:8px 4px;background:var(--bg);border-radius:8px">
              <div style="font-size:9px;color:var(--ink-faint);font-weight:600;letter-spacing:.6px;margin-bottom:3px">СМЗ</div>
              <div style="font-family:Manrope,sans-serif;font-weight:800;font-size:15px">${Math.round((ytd.smz||0)/1000)}к</div>
            </div>
            <div style="padding:8px 4px;background:var(--crit-bg);border-radius:8px">
              <div style="font-size:9px;color:var(--crit);font-weight:600;letter-spacing:.6px;margin-bottom:3px">НАЛОГ 6%</div>
              <div style="font-family:Manrope,sans-serif;font-weight:800;font-size:15px;color:var(--crit)">−${Math.round(taxSmz/1000)}к</div>
            </div>
          </div>
          ${incomeByMonth.map(e => {
            const [y2, mo] = e.month.split('-');
            const moName = moNames[parseInt(mo)] || mo;
            const zpK  = Math.round(e.zp  / 1000);
            const smzK = Math.round(e.smz / 1000);
            return `<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid var(--line)">
              <span style="font-size:12px;color:var(--ink-soft);min-width:36px">${moName}</span>
              <div style="display:flex;gap:6px;align-items:center">
                ${zpK  > 0 ? `<span style="font-size:11px;color:var(--ink-faint)">ЗП ${zpK}к</span>` : ''}

                <span style="font-family:Manrope,sans-serif;font-weight:700;font-size:13px;color:var(--pos)">+${Math.round(e.total/1000)}к</span>
              </div>
            </div>`;
          }).join('')}
          <div style="display:flex;justify-content:space-between;align-items:baseline;padding-top:7px">
            <span style="font-size:12px;color:var(--ink-soft);font-weight:600">Итого · чистыми</span>
            <div style="text-align:right">
              <span style="font-family:Manrope,sans-serif;font-weight:800;font-size:15px">+${Math.round(ytdTotal/1000)}к ₽</span>
              <span style="font-size:11px;color:var(--crit);margin-left:5px">→ ${Math.round(netTotal/1000)}к после налога</span>
            </div>
          </div>
        </div>`;
      })() : ''}
    </div>`;

  /* ── Month metrics ── */
  const mTotal = m.days_in_month || 30;
  const sleepRingColor = m.sleep_on_time_days / mTotal >= 0.7 ? 'var(--pos)'
    : m.sleep_on_time_days / mTotal >= 0.3 ? 'var(--warn)' : 'var(--crit)';
  const workColor = m.workouts >= m.workouts_goal ? 'var(--pos)' : 'var(--bordeaux)';

  const monthCigAvg = m.days_elapsed ? (Math.round(cigMonth / m.days_elapsed * 10) / 10) : '—';
  const monthMetrics = `<div class="rings-grid-2x2">
    ${ring(m.sobriety_days, mTotal, '🍺', 'Трезвость', `${m.sobriety_days} / ${mTotal} дн`)}
    ${ring(m.sleep_on_time_days, mTotal, '🌙', 'Сон', `${m.sleep_on_time_days} / ${mTotal} дн`)}
    ${ring(m.workouts, m.workouts_goal, '🏃', 'Активность', `${m.workouts} / ${m.workouts_goal}`)}
    ${ring(m.intensive || 0, m.intensive_goal || 1, '🏋', 'Интенсивные', `${m.intensive || 0} / ${m.intensive_goal || '?'}`)}
  </div>
  <div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--line);display:flex;align-items:baseline;gap:8px">
    <span style="font-size:9px;font-weight:700;color:var(--ink-faint);letter-spacing:.8px">🚬 СИГАРЕТЫ</span>
    <span style="font-size:28px;font-weight:800;font-family:Manrope,sans-serif;color:var(--ink);line-height:1">${cigMonth}</span>
    <span style="font-size:12px;color:var(--ink-faint)">за месяц</span>
    <span style="font-size:12px;color:var(--ink-soft)">· ${monthCigAvg}/день</span>
  </div>`;

  /* ── Year metrics ── */
  const savedRub = y.saved_rub || 0;
  const savGoal  = y.savings_goal || 480000;
  const savedK   = Math.round(savedRub / 1000);
  const savGoalK = Math.round(savGoal / 1000);

  const yearDays = Math.round((new Date() - new Date(new Date().getFullYear(), 0, 1)) / 86400000) + 1;
  const yearCigAvg = yearDays ? (Math.round(cigYear / yearDays * 10) / 10) : '—';
  const yearMetrics = `<div class="rings-grid-2x2">
    ${ring(y.sobriety_days, y.sobriety_goal, '🍺', 'Трезвость', `${y.sobriety_days} / ${y.sobriety_goal} дн`)}
    ${ring(y.activity_count || 0, y.activity_goal || 365, '🏃', 'Активность', `${y.activity_count || 0} / ${y.activity_goal || 365}`)}
    ${ring(y.intensive_count, y.intensive_goal, '🏋', 'Интенсивные', `${y.intensive_count} / ${y.intensive_goal}`)}
    ${ring(savedK, savGoalK, '💰', 'Накоплено', `${savedK}к / ${savGoalK}к ₽`)}
  </div>
  <div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--line);display:flex;align-items:baseline;gap:8px">
    <span style="font-size:9px;font-weight:700;color:var(--ink-faint);letter-spacing:.8px">🚬 СИГАРЕТЫ</span>
    <span style="font-size:28px;font-weight:800;font-family:Manrope,sans-serif;color:var(--ink);line-height:1">${cigYear}</span>
    <span style="font-size:12px;color:var(--ink-faint)">за год</span>
    <span style="font-size:12px;color:var(--ink-soft)">· ${yearCigAvg}/день</span>
  </div>`;

  /* ── Streak calendar ── */
  const year  = new Date().getFullYear();
  const month = new Date().getMonth();
  const firstDow = (new Date(year, month, 1).getDay() + 6) % 7; // 0=Mon

  const wdHeaders = WEEKDAYS.map(w => `<div class="cal-wd">${w}</div>`).join('');

  const blanks = Array(firstDow).fill('<div class="cal-cell cal-empty"></div>').join('');

  const dayCells = cal.map(item => {
    const soberDot = item.sober === true ? 'ok' : item.sober === false ? 'fail' : 'na';
    const sleepDot = item.sleep_ok === true ? 'ok' : item.sleep_ok === false ? 'fail' : 'na';
    return `<div class="cal-cell">
      <div class="cal-num">${item.day}</div>
      <div class="cal-dots">
        ${dot('cal-dot dot-' + soberDot)}
        ${dot('cal-dot dot-' + sleepDot)}
      </div>
    </div>`;
  }).join('');

  const calHtml = `
    <div class="card cal-card">
      <div class="section-label">Стрик — ${m.name}</div>
      <div class="cal-legend">
        <div class="cal-legend-item"><div class="legend-dot" style="background:var(--pos)"></div>🍺 трезвость</div>
        <div class="cal-legend-item"><div class="legend-dot" style="background:var(--pos)"></div>🌙 сон вовремя</div>
        <div class="cal-legend-item"><div class="legend-dot" style="background:var(--crit);opacity:.75"></div>нарушено</div>
        <div class="cal-legend-item"><div class="legend-dot" style="background:var(--line)"></div>нет данных</div>
      </div>
      <div class="cal-weekdays">${wdHeaders}</div>
      <div class="cal-grid">${blanks}${dayCells}</div>
    </div>`;

  /* ── Life goals ── */
  const goalsHtml = `
    <div class="card goals-card">
      <div class="section-label">Фокус 2026</div>
      <ul class="goals-list">
        <li class="goal-item">
          <span class="goal-icon">🎯</span>
          <span class="goal-text"><strong>Операционный директор</strong> — освоить роль полностью к концу 2026</span>
        </li>
        <li class="goal-item">
          <span class="goal-icon">🍺</span>
          <span class="goal-text"><strong>365 дней трезвости</strong> — начал 18 июня 2026, итого в 2026: ${y.sobriety_days} дн</span>
        </li>
        <li class="goal-item">
          <span class="goal-icon">🏋</span>
          <span class="goal-text"><strong>200 интенсивных тренировок</strong> — strain &gt; 10</span>
        </li>
        <li class="goal-item">
          <span class="goal-icon">💰</span>
          <span class="goal-text"><strong>Накопить 480 000 ₽</strong> — 40 000 в месяц</span>
        </li>
        <li class="goal-item">
          <span class="goal-icon">👨‍👩‍👧</span>
          <span class="goal-text"><strong>Семья</strong> — качественное время с Анной и Евой</span>
        </li>
      </ul>
    </div>`;

  /* ── Weekly averages ── */
  const validSw  = sw.filter(n => n.hours != null);
  const validRw  = rw.filter(n => n.score != null);
  const validHrv = rw.filter(n => n.hrv   != null);
  const avgSleepW = validSw.length
    ? validSw.reduce((s,n) => s + n.hours, 0) / validSw.length : null;
  const avgRecW   = validRw.length
    ? Math.round(validRw.reduce((s,n) => s + n.score, 0) / validRw.length) : null;
  const avgHrvW   = validHrv.length
    ? Math.round(validHrv.reduce((s,n) => s + n.hrv, 0) / validHrv.length) : null;

  /* ── Hero ring ── */
  const recColorHero = t.recovery == null ? 'var(--ink-faint)'
    : t.recovery >= 67 ? '#2A7A52'
    : t.recovery >= 34 ? '#C8A028' : '#B83232';

  const heroRingHtml = (() => {
    const r = t.recovery;
    if (r == null) return `<div style="width:168px;height:168px;margin:0 auto;display:flex;align-items:center;justify-content:center"><span style="font-size:52px;font-weight:800;font-family:Manrope,sans-serif;color:var(--ink-faint)">—</span></div>`;
    const pct   = Math.round(r);
    const fill  = pct.toFixed(1);
    const empty = (100 - pct).toFixed(1);
    return `<div style="position:relative;width:168px;height:168px;margin:0 auto">
      <svg viewBox="0 0 36 36" style="width:168px;height:168px">
        <circle cx="18" cy="18" r="15.9" fill="none" stroke="var(--line)" stroke-width="2.4"/>
        <circle cx="18" cy="18" r="15.9" fill="none" stroke="${recColorHero}"
          stroke-width="2.4" stroke-linecap="round"
          stroke-dasharray="${fill} ${empty}" stroke-dashoffset="25"/>
      </svg>
      <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;line-height:1">
        <div style="font-size:54px;font-weight:800;font-family:Manrope,sans-serif;color:${recColorHero};letter-spacing:-2px">${pct}</div>
        <div style="font-size:10px;font-weight:700;color:var(--ink-faint);letter-spacing:1.2px;margin-top:4px">RECOVERY</div>
      </div>
    </div>`;
  })();

  /* ── 4 life pillars: Сигареты hero + 3 compact numbers ── */
  const lifeRingsHtml = (() => {
    const SPEND_GOAL = 285000;

    // Hero: Сигареты — кольцо = taрget/today (полное = на цели)
    const cigRingPct = cigToday === 0 ? 100 : Math.min(100, Math.round(cigTarget / cigToday * 100));
    const cigColor   = cigToday <= cigTarget ? '#2A7A52'
      : cigToday <= cigTarget + 2 ? '#C8A028' : '#B83232';
    const cigFill  = cigRingPct.toFixed(1);
    const cigEmpty = (100 - cigRingPct).toFixed(1);
    const cigStatus = cigToday === 0 ? 'не курил' : cigToday <= cigTarget ? 'в норме' : `+${cigToday - cigTarget} сверх цели`;

    const heroEl = `<div style="text-align:center;margin-bottom:12px">
      <div onclick="logCigarette(this)" style="position:relative;width:148px;height:148px;margin:0 auto;cursor:pointer">
        <svg viewBox="0 0 36 36" style="width:148px;height:148px">
          <circle cx="18" cy="18" r="15.9" fill="none" stroke="var(--line)" stroke-width="2.4"/>
          <circle cx="18" cy="18" r="15.9" fill="none" stroke="${cigColor}"
            stroke-width="2.4" stroke-linecap="round"
            stroke-dasharray="${cigFill} ${cigEmpty}" stroke-dashoffset="25"/>
        </svg>
        <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;line-height:1">
          <div style="font-size:20px;line-height:1;margin-bottom:3px">🚬</div>
          <div style="font-size:40px;font-weight:800;font-family:Manrope,sans-serif;color:${cigColor};letter-spacing:-2px;line-height:1">${cigToday}<span style="font-size:18px;font-weight:600;color:var(--ink-faint)">/${cigTarget}</span></div>
        </div>
      </div>
      <div style="font-size:13px;font-weight:700;color:var(--ink);margin-top:8px">Сигареты</div>
      <div style="font-size:11px;color:var(--ink-faint);margin-top:3px">${cigStatus} · ${m.cigarettes || 0} за месяц</div>
      <div style="font-size:10px;color:var(--ink-faint);margin-top:2px">нажми на кольцо, чтобы отметить +1</div>
      ${cigToday > 0 ? `<div onclick="logCigarette(this,-1)" style="display:inline-block;margin-top:6px;font-size:11px;color:var(--ink-faint);text-decoration:underline;cursor:pointer;padding:4px 10px">− отменить (случайно нажал)</div>` : ''}
    </div>`;

    // Compact 3: числа напрямую, без процентов
    const wColor = spent > SPEND_GOAL ? '#B83232' : spent > SPEND_GOAL * 0.9 ? '#C8A028' : 'var(--ink)';
    const compact = [
      { emoji: '🍺', big: `${alc != null ? alc : '—'}`, unit: alc != null ? 'дн' : '', label: 'СТРИК · тапни при срыве', onclick: 'logAlcohol()',
        extra: t.can_undo_alcohol ? `<div onclick="event.stopPropagation();logAlcoholUndo()" style="font-size:9px;color:var(--crit);text-decoration:underline;margin-top:2px">отменить срыв</div>` : '' },
      { emoji: '🏋', big: `${m.workouts || 0}`, unit: `из ${m.workouts_goal || '?'}`, label: 'В МЕС' },
      { emoji: '💰', big: `${Math.round(spent / 1000)}к`, unit: `из ${Math.round(SPEND_GOAL / 1000)}к`, label: 'БЮДЖЕТ', color: wColor }
    ];

    const compactEl = `<div class="card" style="padding:14px 8px;margin-bottom:14px;display:flex;align-items:center">
      ${compact.map((p, i) => `
        ${i > 0 ? '<div style="width:1px;background:var(--line);align-self:stretch;margin:2px 0"></div>' : ''}
        <div style="flex:1;text-align:center${p.onclick ? ';cursor:pointer' : ''}"${p.onclick ? ` onclick="${p.onclick}"` : ''}>
          <div style="font-size:15px;line-height:1;margin-bottom:4px">${p.emoji}</div>
          <div style="font-size:17px;font-weight:800;font-family:Manrope,sans-serif;color:${p.color || 'var(--ink)'};line-height:1">${p.big}<span style="font-size:10px;font-weight:500;color:var(--ink-faint);margin-left:2px">${p.unit}</span></div>
          <div style="font-size:9px;color:var(--ink-faint);margin-top:3px;letter-spacing:.3px">${p.label}</div>
          ${p.extra || ''}
        </div>
      `).join('')}
    </div>`;

    const moodPickerHtml = `<div class="card" style="padding:14px 16px;margin-bottom:14px">
      <div class="section-label" style="margin-bottom:8px">Настроение сегодня</div>
      <div style="display:flex;justify-content:space-between;gap:6px">
        ${[1,2,3,4,5].map(s => `<button onclick="logMood(${s},this)" style="flex:1;padding:10px 0;border-radius:10px;border:1.5px solid ${t.mood===s?'var(--bordeaux)':'var(--line)'};background:${t.mood===s?'var(--pos-bg)':'var(--card)'};font-size:20px;cursor:pointer;font-family:inherit">${MOOD_EMOJI[s]}</button>`).join('')}
      </div>
      ${t.mood != null ? `<div onclick="logMoodClear(this)" style="text-align:center;margin-top:8px;font-size:11px;color:var(--ink-faint);text-decoration:underline;cursor:pointer">× очистить отметку за сегодня</div>` : ''}
    </div>`;

    return heroEl + compactEl + moodPickerHtml;
  })();

  /* ── Time period bars ── */
  const timeBarsHtml = (() => {
    const now    = new Date(d.generated_at || Date.now());
    const doy    = Math.floor((now - new Date(now.getFullYear(), 0, 0)) / 86400000);
    const yTotal = y.sobriety_goal || 365;
    const yPct   = Math.round(doy / yTotal * 100);
    const mDay   = m.days_elapsed || now.getDate();
    const mTotal = m.days_in_month || 30;
    const mPct   = Math.round(mDay / mTotal * 100);
    const mName  = (m.name || '').toUpperCase();
    const GRAD   = 'linear-gradient(to right,#2A7A52 0%,#86B830 30%,#C8A028 55%,#D4701C 75%,#B83232 100%)';
    function timebar(label, pct, cur, total) {
      const remaining = total - cur;
      return `<div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px">
          <span style="font-size:10px;font-weight:700;color:var(--ink-faint);letter-spacing:.7px">${label}</span>
          <div style="display:flex;align-items:baseline;gap:5px">
            <span style="font-size:24px;font-weight:800;font-family:Manrope,sans-serif;color:var(--ink);line-height:1">${pct}%</span>
            <span style="font-size:11px;color:var(--ink-faint)">· ещё ${remaining} дн</span>
          </div>
        </div>
        <div style="position:relative;height:9px;border-radius:5px;background:${GRAD};overflow:hidden">
          <div style="position:absolute;right:0;top:0;width:${100 - pct}%;height:100%;background:var(--line)"></div>
        </div>
      </div>`;
    }
    return `<div class="card" style="padding:16px;display:flex;flex-direction:column;gap:18px">
      ${timebar('ГОД ' + now.getFullYear(), yPct, doy, yTotal)}
      ${timebar(mName, mPct, mDay, mTotal)}
    </div>`;
  })();

  /* ── Assemble ── */
  document.getElementById('content').innerHTML = `
    <div class="tab-bar" id="tab-bar">
      <button class="tab-pill active" data-section="s-today">Сегодня</button>
      <button class="tab-pill" data-section="s-finance">Финансы</button>
      <button class="tab-pill" data-section="s-sleep">Сон</button>
      <button class="tab-pill" data-section="s-month">Месяц</button>
      <button class="tab-pill" data-section="s-year">Год</button>
    </div>

    <section class="tab-section" id="s-today">

      <div class="action-bar">
        <span class="action-arrow">→</span>
        <span class="action-text">${t.action || ''}</span>
      </div>

      ${sleepCommitmentHtml}
      ${lifeRingsHtml}
      ${whoopStrip}

      ${timeBarsHtml}

    </section>

    <section class="tab-section" id="s-finance" style="display:none">
      ${financeHtml}
    </section>

    <section class="tab-section" id="s-sleep" style="display:none">
      ${sleepWeekHtml}
      <div style="margin-top:8px">
        <div class="section-label" style="margin-bottom:8px">Среднее за 7 дней</div>
        <div class="whoop-strip">
          <div class="card"><div class="whoop-cell">
            <div class="whoop-label">Сон</div>
            <div class="whoop-value">${avgSleepW != null ? sleepH(avgSleepW) : '—'}</div>
            <div class="whoop-sub">7 ночей</div>
          </div></div>
          <div class="card"><div class="whoop-cell">
            <div class="whoop-label">Recovery</div>
            <div class="whoop-value">${avgRecW != null ? avgRecW : '—'}<span class="unit">%</span></div>
            <div class="whoop-sub">7 дней</div>
          </div></div>
          <div class="card"><div class="whoop-cell">
            <div class="whoop-label">HRV</div>
            <div class="whoop-value">${avgHrvW != null ? avgHrvW : '—'}<span class="unit">мс</span></div>
            <div class="whoop-sub">7 дней</div>
          </div></div>
        </div>
      </div>
    </section>

    <section class="tab-section" id="s-month" style="display:none">
      <div class="card section-card">
        <div class="section-label">${m.name}</div>
        ${monthMetrics}
      </div>
    </section>

    <section class="tab-section" id="s-year" style="display:none">
      <div class="card section-card">
        <div class="section-label">Год 2026</div>
        ${yearMetrics}
      </div>
    </section>
  `;

  /* ── Tab switching ── */
  function showTab(id) {
    document.querySelectorAll('.tab-section').forEach(s => {
      s.style.display = s.id === id ? '' : 'none';
    });
    document.querySelectorAll('.tab-pill').forEach(p => {
      p.classList.toggle('active', p.dataset.section === id);
    });
    window.scrollTo({ top: 0, behavior: 'instant' });
  }

  document.querySelectorAll('.tab-pill').forEach(p => {
    p.addEventListener('click', () => showTab(p.dataset.section));
  });

  const gen  = new Date(d.generated_at);
  const opts = { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Moscow' };
  document.getElementById('updated').textContent = 'обновлено ' + gen.toLocaleString('ru-RU', opts);
}

/* ── Запись событий прямо с дашборда ── */
const TOKEN_KEY = 'dash_write_token';

function getToken() {
  let t = localStorage.getItem(TOKEN_KEY);
  if (!t) {
    t = prompt('Токен записи (см. credentials/dashboard_write_token):');
    if (t && t.trim()) { t = t.trim(); localStorage.setItem(TOKEN_KEY, t); }
    else t = null;
  }
  return t;
}

async function logEvent(payload, btnEl) {
  const token = getToken();
  if (!token) return;
  if (btnEl) btnEl.style.opacity = '.5';
  try {
    const r = await fetch('/api/log', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify(payload),
    });
    if (r.status === 401) {
      localStorage.removeItem(TOKEN_KEY);
      alert('Неверный токен записи. Попробуй ещё раз — он спросится заново.');
      return;
    }
    if (!r.ok) { alert('Не получилось записать (' + r.status + ')'); return; }
    await loadAndRender();
  } catch (e) {
    alert('Нет связи с сервером: ' + e.message);
  } finally {
    if (btnEl) btnEl.style.opacity = '';
  }
}

function logCigarette(el, delta) { logEvent({ type: 'cigarette', delta: delta === -1 ? -1 : 1 }, el); }
function logMood(score, el) { logEvent({ type: 'mood', score }, el); }
function logMoodClear(el) { logEvent({ type: 'mood_clear' }, el); }
function logAlcohol() {
  if (confirm('Записать срыв? Стрик трезвости сбросится на 0, накопленные дни сохранятся.')) {
    logEvent({ type: 'alcohol' });
  }
}
function logAlcoholUndo() {
  if (confirm('Отменить последний срыв и вернуть стрик как было?')) {
    logEvent({ type: 'alcohol_undo' });
  }
}

async function loadAndRender() {
  const d = await fetch('data.json?v=' + Date.now()).then(r => r.json());
  try {
    const live = await fetch('/api/computed?v=' + Date.now()).then(r => r.json());
    Object.assign(d.today, live.today);
    Object.assign(d.month, live.month);
    Object.assign(d.year, live.year);
    d.mood_week = live.mood_week;
  } catch (e) {
    // живые данные недоступны — показываем то, что есть в последнем батче
  }
  render(d);
}

loadAndRender().catch(() => {
  document.getElementById('content').innerHTML = '<div class="loading">Ошибка загрузки данных</div>';
});
</script>
