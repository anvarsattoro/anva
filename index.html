<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Анвар · Жизнь</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --ink:       #1A1A1F;
  --ink-soft:  #4C4A52;
  --ink-faint: #8A857E;
  --paper:     #F7F4EF;
  --card:      #FCFAF6;
  --line:      #E6DFD3;
  --bg:        #E2DDD5;
  --bordeaux:  #8E2C2C;
  --pos:       #2A7A52;
  --pos-bg:    #EAF5EF;
  --warn:      #B87A18;
  --warn-bg:   #FDF3E0;
  --crit:      #B83232;
  --crit-bg:   #FAECEC;
  --card-shadow: 0 1px 3px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.07);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  padding: 28px 16px 60px;
  -webkit-font-smoothing: antialiased;
}

.page { max-width: 820px; margin: 0 auto; }

/* ── Header ── */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 28px;
  padding: 0 2px;
}
.header-title {
  font-family: 'Manrope', sans-serif;
  font-weight: 800;
  font-size: 20px;
  letter-spacing: .04em;
  color: var(--ink);
}
.header-title .dot { color: var(--bordeaux); }
.header-sub {
  font-size: 11px;
  color: var(--ink-faint);
  letter-spacing: .05em;
}

/* ── Section label ── */
.section-label {
  font-family: 'Manrope', sans-serif;
  font-weight: 700;
  font-size: 10px;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--bordeaux);
  margin-bottom: 10px;
}

/* ── Card base ── */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 18px;
  box-shadow: var(--card-shadow);
}

/* ── WHOOP compact strip ── */
.whoop-strip {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  margin-bottom: 12px;
}
.whoop-strip .card { border-radius: 0; border-right: none; }
.whoop-strip .card:first-child { border-radius: 18px 0 0 18px; }
.whoop-strip .card:last-child  { border-radius: 0 18px 18px 0; border-right: 1px solid var(--line); }

.whoop-cell {
  padding: 14px 18px;
}
.whoop-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin-bottom: 5px;
}
.whoop-value {
  font-family: 'Manrope', sans-serif;
  font-weight: 800;
  font-size: 28px;
  line-height: 1;
  letter-spacing: -.02em;
  color: var(--ink);
  display: flex;
  align-items: baseline;
  gap: 3px;
}
.whoop-value .unit {
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-soft);
}
.whoop-sub {
  font-size: 11px;
  color: var(--ink-faint);
  margin-top: 3px;
}
.whoop-target {
  font-size: 10px;
  color: var(--ink-faint);
  margin-top: 5px;
  display: flex;
  align-items: center;
  gap: 5px;
}
.whoop-target .tval,
.tval {
  font-family: 'Manrope', sans-serif;
  font-weight: 700;
  font-size: 10px;
}
.tval.met,
.whoop-target .tval.met   { color: var(--pos); }
.tval.unmet,
.whoop-target .tval.unmet { color: var(--crit); }
.whoop-target .tarrow {
  font-size: 9px;
  opacity: .5;
}
.rec-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  margin-right: 6px;
  margin-bottom: 2px;
  vertical-align: middle;
}
.rec-dot.good { background: var(--pos); }
.rec-dot.warn { background: var(--warn); }
.rec-dot.crit { background: var(--crit); }

/* ── Habit chips ── */
.chips {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 12px;
}
/* ── Mobile: iPhone 14 Pro Max (430px) — compact horizontal layout ── */
@media (max-width: 500px) {
  body { padding: 18px 12px 48px; }

  .header { margin-bottom: 20px; }
  .header-title { font-size: 17px; letter-spacing: .03em; }
  .header-sub { font-size: 10px; }

  /* WHOOP strip: keep 3 cols, shrink everything */
  .whoop-cell { padding: 10px 10px 10px 12px; }
  .whoop-label { font-size: 8.5px; letter-spacing: .06em; }
  .whoop-value { font-size: 21px; }
  .whoop-value .unit { font-size: 11px; }
  .whoop-sub { font-size: 9.5px; margin-top: 2px; }
  .whoop-target { font-size: 9px; margin-top: 4px; gap: 3px; }
  .whoop-target .tval { font-size: 9px; }
  .rec-dot { width: 7px; height: 7px; margin-right: 4px; }

  /* Habit chips: keep 3 cols, tighter */
  .chips { gap: 7px; }
  .chip { padding: 12px 8px; gap: 8px; border-left-width: 3px; }
  .chip-icon { font-size: 18px; }
  .chip-main { font-size: 17px; }
  .chip-sub { font-size: 10px; margin-top: 2px; }

  /* Action bar */
  .action-bar { padding: 12px 16px; gap: 10px; margin-bottom: 20px; }
  .action-text { font-size: 12.5px; }

  /* Charts */
  .sleep-chart-card { padding: 14px 14px; }
  .sleep-bars { height: 52px; gap: 5px; }
  .sleep-bar-hours { font-size: 8.5px; }
  .sleep-bar-label { font-size: 9px; }

  /* Bottom grid: 2 cols but compact */
  .bottom-grid { gap: 8px; margin-bottom: 12px; }
  .section-card { padding: 14px 10px 12px; }
  .metric { padding: 8px 0; }
  .metric-name { font-size: 11px; }
  .metric-value { font-size: 13px; }

  /* Rings compact */
  .ring-chart { width: 60px; height: 60px; }
  .ring-pct { font-size: 11px; }
  .ring-label { font-size: 10px; }
  .ring-sub { font-size: 9px; }

  /* Calendar */
  .cal-card { padding: 14px 12px; }
  .cal-dot { width: 14px; height: 6px; }
  .cal-num { font-size: 8px; }
  .cal-legend { gap: 10px; flex-wrap: wrap; }
  .cal-legend-item { font-size: 10px; }

  /* Goals */
  .goals-card { padding: 14px 14px; }
  .goal-item { padding: 9px 0; gap: 10px; }
  .goal-icon { font-size: 16px; width: 22px; }
  .goal-text { font-size: 12px; }

  .section-label { font-size: 9.5px; margin-bottom: 8px; }
  .spacer { height: 10px; }
  .card { border-radius: 14px; }
}

.chip {
  padding: 16px 18px;
  display: flex;
  align-items: center;
  gap: 14px;
  border-left: 3px solid var(--line);
}
.chip.ok   { border-left-color: var(--pos);  background: var(--pos-bg); }
.chip.warn { border-left-color: var(--warn); background: var(--warn-bg); }
.chip.fail { border-left-color: var(--crit); background: var(--crit-bg); }
.chip-icon { font-size: 24px; flex-shrink: 0; }
.chip-main {
  font-family: 'Manrope', sans-serif;
  font-weight: 800;
  font-size: 22px;
  line-height: 1;
  color: var(--ink);
}
.chip-sub  {
  font-size: 11px;
  color: var(--ink-faint);
  margin-top: 3px;
  line-height: 1.4;
}

/* ── Action bar ── */
.action-bar {
  background: var(--ink);
  border-radius: 14px;
  padding: 14px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 28px;
  box-shadow: 0 4px 16px rgba(26,26,31,0.18);
}
.action-arrow {
  font-family: 'Manrope', sans-serif;
  font-weight: 700;
  font-size: 16px;
  color: var(--bordeaux);
  flex-shrink: 0;
}
.action-text {
  font-size: 13px;
  color: #F0ECE5;
  font-weight: 500;
  line-height: 1.4;
}

/* ── Sleep week chart ── */
.sleep-chart-card {
  padding: 20px 22px;
  margin-bottom: 16px;
}
.sleep-bars {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  height: 64px;
  margin: 12px 0 6px;
}
.sleep-bar-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  height: 100%;
  justify-content: flex-end;
}
.sleep-bar {
  width: 100%;
  border-radius: 5px 5px 0 0;
  min-height: 4px;
  transition: height .3s ease;
}
.sleep-bar.ok    { background: var(--pos); }
.sleep-bar.warn  { background: var(--warn); }
.sleep-bar.late  { background: var(--crit); opacity: .8; }
.sleep-bar.nodata { background: var(--line); }
.sleep-bar-label {
  font-size: 10px;
  color: var(--ink-faint);
  font-weight: 500;
}
.sleep-bar-hours {
  font-size: 9px;
  color: var(--ink-faint);
  height: 12px;
  line-height: 12px;
}

/* ── Month + Year grid ── */
.bottom-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-bottom: 16px;
}
@media (max-width: 600px) { .bottom-grid { grid-template-columns: 1fr; } }

.section-card {
  padding: 18px 16px 16px;
  border-left: 3px solid var(--bordeaux);
  border-radius: 0 18px 18px 0;
}

/* ── Rings ── */
.rings-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}
.rings-grid-2x2 {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 6px;
}
.ring-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  padding: 4px 0;
}
.ring-chart {
  position: relative;
  width: 72px;
  height: 72px;
}
.ring-chart svg { width: 100%; height: 100%; }
.ring-inner {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
}
.ring-pct {
  font-family: 'Manrope', sans-serif;
  font-weight: 800;
  font-size: 13px;
  color: var(--ink);
  letter-spacing: -.03em;
  line-height: 1;
}
.ring-icon { font-size: 15px; line-height: 1; }
.ring-label {
  font-size: 11px;
  color: var(--ink-soft);
  font-weight: 500;
  text-align: center;
  line-height: 1.3;
}
.ring-sub {
  font-size: 9.5px;
  color: var(--ink-faint);
  text-align: center;
  line-height: 1.3;
}

/* ── Metric rows ── */
.metric {
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
}
.metric:last-child { border-bottom: none; padding-bottom: 0; }
.metric:first-child { padding-top: 0; }
.metric-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 6px;
}
.metric-name  { font-size: 12px; color: var(--ink-soft); }
.metric-value {
  font-family: 'Manrope', sans-serif;
  font-weight: 700;
  font-size: 14px;
  color: var(--ink);
  white-space: nowrap;
}

/* ── Progress bar ── */
.bar-track {
  height: 5px;
  background: var(--line);
  border-radius: 99px;
  overflow: hidden;
}
.bar-fill {
  height: 100%;
  border-radius: 99px;
  background: var(--bordeaux);
}
.bar-fill.good { background: var(--pos); }
.bar-fill.over { background: var(--pos); }
.bar-footer {
  display: flex;
  justify-content: space-between;
  margin-top: 4px;
}
.bar-pct { font-size: 10px; color: var(--ink-faint); }

/* ── Streak calendar ── */
.cal-card {
  padding: 20px 22px;
  margin-bottom: 16px;
}
.cal-legend {
  display: flex;
  gap: 16px;
  margin-bottom: 12px;
}
.cal-legend-item {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  color: var(--ink-faint);
}
.legend-dot {
  width: 10px; height: 10px;
  border-radius: 2px;
  flex-shrink: 0;
}
.cal-weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  margin-bottom: 4px;
}
.cal-wd {
  text-align: center;
  font-size: 9px;
  font-weight: 600;
  letter-spacing: .06em;
  color: var(--ink-faint);
  text-transform: uppercase;
}
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
}
.cal-cell {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 2px 0;
}
.cal-empty { /* blank day offset */ }
.cal-num {
  font-size: 9px;
  color: var(--ink-faint);
  font-variant-numeric: tabular-nums;
  margin-bottom: 1px;
}
.cal-dots {
  display: flex;
  flex-direction: column;
  gap: 2px;
  width: 100%;
  align-items: center;
}
.cal-dot {
  width: 18px;
  height: 7px;
  border-radius: 2px;
}
.dot-ok   { background: var(--pos); }
.dot-fail { background: var(--crit); opacity: .75; }
.dot-na   { background: var(--line); }

/* ── Life goals ── */
.goals-card {
  padding: 20px 22px;
  margin-bottom: 0;
}
.goals-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 0;
}
.goal-item {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 11px 0;
  border-bottom: 1px solid var(--line);
}
.goal-item:first-child { padding-top: 0; }
.goal-item:last-child  { border-bottom: none; padding-bottom: 0; }
.goal-icon { font-size: 18px; flex-shrink: 0; width: 28px; text-align: center; }
.goal-text { font-size: 13px; color: var(--ink-soft); line-height: 1.4; }
.goal-text strong { color: var(--ink); font-weight: 600; }

/* ── Misc ── */
.spacer { height: 16px; }
.loading { text-align: center; padding: 80px 0; color: var(--ink-faint); font-size: 14px; }

/* ── Tab navigation ── */
.tab-bar {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 8px 0 12px;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  position: sticky;
  top: 0;
  background: var(--bg);
  z-index: 50;
}
.tab-bar::-webkit-scrollbar { display: none; }
.tab-pill {
  flex-shrink: 0;
  padding: 5px 13px;
  border-radius: 20px;
  background: var(--card);
  border: 1.5px solid var(--line);
  font-size: 12px;
  font-weight: 600;
  font-family: inherit;
  color: var(--ink-soft);
  cursor: pointer;
  white-space: nowrap;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  outline: none;
}
.tab-pill.active {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}
.tab-section { scroll-margin-top: 52px; }
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <div class="header-title">АНВАР <span class="dot">·</span> ЖИЗНЬ</div>
    <div class="header-sub" id="updated">загрузка...</div>
  </div>
  <div id="content"><div class="loading">Загрузка данных...</div></div>
</div>

<script>
const DAY_ABBR = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const WEEKDAYS = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];

function bar(cur, goal, variant) {
  const raw = goal > 0 ? cur / goal : 0;
  const pct = Math.min(100, Math.round(raw * 100));
  const cls = variant || (raw >= 1 ? 'over' : '');
  return `<div class="bar-track"><div class="bar-fill ${cls}" style="width:${pct}%"></div></div>
    <div class="bar-footer">
      <span class="bar-pct">${cur} / ${goal}</span>
      <span class="bar-pct">${pct}%</span>
    </div>`;
}

function rub(n) {
  if (n == null) return '—';
  return n >= 1000 ? Math.round(n / 1000) + 'к ₽' : n + ' ₽';
}

function recClass(r) {
  if (r == null) return '';
  return r >= 67 ? 'good' : r >= 34 ? 'warn' : 'crit';
}

function sleepH(h) {
  if (h == null) return '—';
  const hrs = Math.floor(h);
  const min = Math.round((h - hrs) * 60);
  return min > 0 ? `${hrs}ч ${min}м` : `${hrs}ч`;
}

function dot(cls) {
  return `<div class="cal-dot ${cls}"></div>`;
}

function ringColor(pct) {
  if (pct >= 90) return '#2A7A52';   // насыщенный зелёный
  if (pct >= 75) return '#4EA843';   // зелёный
  if (pct >= 55) return '#86B830';   // жёлто-зелёный
  if (pct >= 35) return '#C8A028';   // жёлтый
  if (pct >= 15) return '#D4701C';   // оранжевый
  return '#8E2C2C';                   // бордо
}

function ring(cur, goal, icon, label, sub) {
  const pct = goal > 0 ? Math.min(100, Math.round(cur / goal * 100)) : 0;
  const fill = pct.toFixed(1);
  const empty = (100 - pct).toFixed(1);
  const color = ringColor(pct);
  return `<div class="ring-wrap">
    <div class="ring-chart">
      <svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
        <circle cx="18" cy="18" r="15.9" fill="none" stroke="var(--line)" stroke-width="3.8"/>
        <circle cx="18" cy="18" r="15.9" fill="none" stroke="${color}"
          stroke-width="3.8" stroke-linecap="round"
          stroke-dasharray="${fill} ${empty}" stroke-dashoffset="25"/>
      </svg>
      <div class="ring-inner">
        <div class="ring-pct">${pct}%</div>
      </div>
    </div>
    <div class="ring-label">${icon} ${label}</div>
    <div class="ring-sub">${sub}</div>
  </div>`;
}

function render(d) {
  const t   = d.today;
  const m   = d.month;
  const y   = d.year;
  const sw  = d.sleep_week || [];
  const rw  = d.recovery_week || [];
  const mw  = d.mood_week || [];
  const cal = d.month_calendar || [];
  const fin = d.finances || {};

  /* ── WHOOP strip ── */
  const rc = recClass(t.recovery);
  const REC_TARGET  = 67;
  const SLEEP_TARGET = 7.5; // 7ч 30м
  const RHR_TARGET   = 52;  // пульс покоя ≤ 52

  function target(actual, goal, fmtFn, label, lowerIsBetter) {
    if (actual == null) return '';
    const met = lowerIsBetter ? actual <= goal : actual >= goal;
    const cls = met ? 'met' : 'unmet';
    const arrow = met ? '↑' : '↓';
    return `<div class="whoop-target">
      <span class="tarrow">${arrow}</span>
      <span>цель</span>
      <span class="tval ${cls}">${fmtFn(goal)}</span>
      ${label ? '<span>' + label + '</span>' : ''}
    </div>`;
  }

  const whoopStrip = `
    <div class="whoop-strip">
      <div class="card">
        <div class="whoop-cell">
          <div class="whoop-label">Recovery</div>
          <div class="whoop-value">
            <span class="rec-dot ${rc}"></span>
            ${t.recovery != null ? Math.round(t.recovery) : '—'}<span class="unit">%</span>
          </div>
          ${target(t.recovery, REC_TARGET, v => v + '%', '', false)}
        </div>
      </div>
      <div class="card">
        <div class="whoop-cell">
          <div class="whoop-label">Сон</div>
          <div class="whoop-value">${sleepH(t.sleep_hours)}</div>
          <div class="whoop-sub">лёг ${t.sleep_start || '—'}</div>
          ${target(t.sleep_hours, SLEEP_TARGET, sleepH, '', false)}
        </div>
      </div>
      <div class="card">
        <div class="whoop-cell">
          <div class="whoop-label">HRV · ЧСС покоя</div>
          <div class="whoop-value">
            ${t.hrv_ms != null ? Math.round(t.hrv_ms) : '—'}<span class="unit">мс</span>
          </div>
          ${(() => {
            const rhrVal = t.rhr != null ? Math.round(t.rhr) : null;
            const rhrMet = rhrVal != null && rhrVal <= RHR_TARGET;
            const rhrCls = rhrVal != null ? (rhrMet ? 'met' : 'unmet') : '';
            const rhrStr = rhrVal != null
              ? `<span class="tval ${rhrCls}">${rhrVal}</span>`
              : '—';
            return `<div class="whoop-sub">пульс покоя ${rhrStr} · цель ≤${RHR_TARGET} уд/мин</div>`;
          })()}
        </div>
      </div>
    </div>`;

  /* ── Habit chips ── */
  const alc = t.alcohol_free_days;
  const alcChip = `<div class="card chip ok">
    <span class="chip-icon">🍺</span>
    <div>
      <div class="chip-main">${alc != null ? alc + ' дн' : '—'}</div>
      <div class="chip-sub">🌿</div>
    </div>
  </div>`;

  const sleepOk = t.sleep_on_time;
  const lateMins = t.sleep_late_min || 0;
  const sleepChip = `<div class="card chip ${sleepOk ? 'ok' : 'fail'}">
    <span class="chip-icon">🌙</span>
    <div>
      <div class="chip-main">${sleepOk ? '✅' : '❌'}</div>
      <div class="chip-sub">лёг ${t.sleep_start || '—'}${!sleepOk && lateMins > 0 ? '<br>+' + lateMins + ' мин от цели' : ''}</div>
    </div>
  </div>`;

  const SPORT_EMOJI = {
    'Бег': '🏃', 'Велосипед': '🚴', 'Спиннинг': '🚴',
    'Теннис': '🎾', 'Бадминтон': '🏸', 'Сквош': '🏸', 'Падл-теннис': '🏓', 'Пинг-понг': '🏓', 'Падл': '🏓',
    'Силовая': '🏋', 'Бодибилдинг': '🏋', 'Функционалка': '💪', 'HIIT': '⚡', 'Кросс-кантри': '⛰️',
    'Йога': '🧘', 'Медитация': '🧘', 'Пилатес': '🤸', 'Стретч': '🤸',
    'Заплыв': '🏊', 'Водное поло': '🤽', 'Триатлон': '🏊',
    'Футбол': '⚽', 'Футбол американский': '🏈', 'Баскетбол': '🏀', 'Волейбол': '🏐',
    'Хоккей на льду': '🏒', 'Хоккей на траве': '🏑', 'Регби': '🏉', 'Лакросс': '🥍',
    'Бокс': '🥊', 'Кикбоксинг': '🥊', 'Борьба': '🤼', 'Фехтование': '🤺',
    'Гребля': '🚣', 'Парус': '⛵', 'Лыжи': '⛷️', 'Гольф': '⛳',
    'Скалолазание': '🧗', 'Походы': '🥾', 'Скейтборд': '🛹',
    'Бейсбол': '⚾', 'Софтбол': '🥎', 'Лёгкая атлетика': '🏅',
  };
  const trainIcon  = t.trained ? (SPORT_EMOJI[t.workout_type] || '🏋') : '🏋';
  const trainClass = t.trained ? 'ok' : 'warn';
  const trainMain  = t.trained ? '✅' : '—';
  const trainSub   = t.trained
    ? `${t.workout_type || 'тренировка'}${t.workout_strain != null ? '<br>страйн ' + t.workout_strain : ''}`
    : 'нет тренировки';
  const trainChip = `<div class="card chip ${trainClass}">
    <span class="chip-icon">${trainIcon}</span>
    <div>
      <div class="chip-main">${trainMain}</div>
      <div class="chip-sub">${trainSub}</div>
    </div>
  </div>`;

  const MOOD_EMOJI = {1:'😞', 2:'😔', 3:'😐', 4:'😊', 5:'🌟'};
  const MOOD_LABEL = {1:'тяжело', 2:'плохо', 3:'нормально', 4:'хорошо', 5:'отлично'};
  const moodScore = t.mood;
  const moodClass = moodScore == null ? '' : moodScore >= 4 ? 'ok' : moodScore >= 3 ? 'warn' : 'fail';
  const moodChip = `<div class="card chip ${moodClass}">
    <span class="chip-icon">${moodScore != null ? MOOD_EMOJI[moodScore] : '🙂'}</span>
    <div>
      <div class="chip-main">${moodScore != null ? moodScore + '/5' : '—'}</div>
      <div class="chip-sub">${moodScore != null ? MOOD_LABEL[moodScore] : 'отправь «н 1-5»'}</div>
    </div>
  </div>`;

  /* ── Sleep + Recovery week charts ── */
  const MAX_H = 9;
  const MAX_PX = 56;

  function miniBarChart(items, topLabelFn, clsFn) {
    return items.map(n => {
      const val = n.hours != null ? n.hours : n.score;
      const maxVal = n.hours != null ? MAX_H : 100;
      const px = val != null ? Math.max(4, Math.round((Math.min(val, maxVal) / maxVal) * MAX_PX)) : 4;
      const cls = clsFn(n);
      const label = topLabelFn(n);
      return `<div class="sleep-bar-col">
        <div class="sleep-bar-hours">${label}</div>
        <div class="sleep-bar ${cls}" style="height:${px}px"></div>
        <div class="sleep-bar-label">${n.label}</div>
      </div>`;
    }).join('');
  }

  function sleepColor(h) {
    if (h == null) return 'var(--line)';
    if (h >= 7.5) return '#2A7A52';   // зелёный — цель
    if (h >= 7.0) return '#74B852';   // салатовый
    if (h >= 6.5) return '#B8C030';   // жёлто-зелёный
    if (h >= 6.0) return '#C8A028';   // жёлтый
    if (h >= 5.0) return '#D4701C';   // оранжевый
    return '#B83232';                  // красный
  }

  const sleepBars = sw.map(n => {
    const h = n.hours;
    const px = h != null ? Math.max(4, Math.round((Math.min(h, MAX_H) / MAX_H) * MAX_PX)) : 4;
    const bg = sleepColor(h);
    const label = h != null ? h + 'ч' : '';
    return `<div class="sleep-bar-col">
      <div class="sleep-bar-hours">${label}</div>
      <div class="sleep-bar" style="height:${px}px;background:${bg}"></div>
      <div class="sleep-bar-label">${n.label}</div>
    </div>`;
  }).join('');

  const recBars = miniBarChart(
    rw,
    n => n.score != null ? n.score + '%' : '',
    n => n.score == null ? 'nodata' : n.score >= 67 ? 'ok' : n.score >= 34 ? 'warn' : 'late'
  );

  // Mood 7-day chart
  const moodColors = {1:'#B83232', 2:'#D4701C', 3:'#C8A028', 4:'#74B852', 5:'#2A7A52'};
  const moodBars = mw.map(n => {
    const s = n.score;
    const px = s != null ? Math.max(4, Math.round((s / 5) * MAX_PX)) : 4;
    const bg = s != null ? moodColors[s] : 'var(--line)';
    const label = s != null ? MOOD_EMOJI[s] : '';
    return `<div class="sleep-bar-col">
      <div class="sleep-bar-hours">${label}</div>
      <div class="sleep-bar" style="height:${px}px;background:${bg}"></div>
      <div class="sleep-bar-label">${n.label}</div>
    </div>`;
  }).join('');

  const sleepWeekHtml = `
    <div class="card sleep-chart-card">
      <div class="section-label">Сон — 7 ночей</div>
      <div class="sleep-bars">${sleepBars}</div>
      <div style="height:14px"></div>
      <div class="section-label">Recovery — 7 дней</div>
      <div class="sleep-bars">${recBars}</div>
      <div style="height:14px"></div>
      <div class="section-label">Настроение — 7 дней</div>
      <div class="sleep-bars">${moodBars}</div>
    </div>`;

  // Finance card
  const income   = fin.monthly_income || 400000;
  const expGoal  = fin.monthly_expense_goal || 300000;
  const spent    = fin.month_expenses || 0;
  const creditRep = fin.credit_repayment || 0;
  const newSpent = spent - creditRep;  // реальные новые траты без погашения долга
  const free     = income - spent;
  const spentPct = Math.min(100, Math.round(spent / expGoal * 100));
  const spentColor = spentPct >= 100 ? 'var(--crit)' : spentPct >= 90 ? 'var(--warn)' : 'var(--pos)';
  const cats = (fin.categories || []).filter(c => c.amount > 0);
  const catRows = cats.map(c => {
    const limit = c.limit || 0;
    const pctOfLimit  = limit > 0 ? Math.round(c.amount / limit * 100) : null;
    const pctOfBudget = spent  > 0 ? Math.round(c.amount / spent * 100) : 0;
    const barW = pctOfLimit != null ? Math.min(100, pctOfLimit) : pctOfBudget;
    const barColor = pctOfLimit == null ? 'var(--ink-soft)'
      : pctOfLimit >= 100 ? 'var(--crit)'
      : pctOfLimit >= 80  ? 'var(--warn)'
      : 'var(--pos)';
    const nm = c.name.length > 18 ? c.name.slice(0, 17) + '…' : c.name;
    const amtStr  = Math.round(c.amount / 1000) + 'к';
    const limStr  = limit > 0 ? ' / ' + Math.round(limit / 1000) + 'к ₽' : ' ₽';
    const overTag = pctOfLimit != null && pctOfLimit > 100
      ? `<span style="font-size:10px;color:var(--crit);font-weight:700;margin-left:4px">↑${pctOfLimit}%</span>` : '';
    return `<div style="margin:7px 0">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px">
        <span style="font-size:12px;color:var(--ink-soft)">${nm}${overTag}</span>
        <div style="text-align:right">
          <span style="font-size:12px;font-weight:700;color:${barColor}">${amtStr}</span><span style="font-size:11px;color:var(--ink-faint)">${limStr}</span>
          <span style="font-size:10px;color:var(--ink-faint);margin-left:6px">${pctOfBudget}% бюд</span>
        </div>
      </div>
      <div style="background:var(--line);border-radius:3px;height:4px">
        <div style="width:${barW}%;height:4px;background:${barColor};border-radius:3px;transition:width .3s"></div>
      </div>
    </div>`;
  }).join('');
  const financeHtml = `
    <div class="card sleep-chart-card" style="margin-bottom:16px">
      <div class="section-label">Финансы — ${m.name}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 12px">
        <div>
          <div class="whoop-label">Доход</div>
          <div style="font-family:Manrope,sans-serif;font-weight:800;font-size:17px">${Math.round(income/1000)}к ₽</div>
        </div>
        <div>
          <div class="whoop-label">Свободно</div>
          <div style="font-family:Manrope,sans-serif;font-weight:800;font-size:17px;color:${free>=0?'var(--pos)':'var(--crit)'}">${free>=0?'':'−'}${Math.round(Math.abs(free)/1000)}к ₽</div>
        </div>
        <div>
          <div class="whoop-label">Расходы</div>
          <div style="font-family:Manrope,sans-serif;font-weight:800;font-size:17px;color:${spentColor}">${Math.round(newSpent/1000)}к ₽</div>
          <div class="whoop-sub">цель ≤${Math.round(expGoal/1000)}к</div>
        </div>
        <div>
          <div class="whoop-label">💳 Погашение долга</div>
          <div style="font-family:Manrope,sans-serif;font-weight:800;font-size:17px;color:var(--warn)">${Math.round(creditRep/1000)}к ₽</div>
          <div class="whoop-sub">погашение кредитки</div>
        </div>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${spentPct}%;background:${spentColor}"></div></div>
      <div class="bar-footer"><span class="bar-pct">итого ${Math.round(spent/1000)}к / ${Math.round(expGoal/1000)}к ₽</span><span class="bar-pct">${spentPct}%</span></div>
      ${cats.length ? `<div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--line)">
        <div class="whoop-label" style="margin-bottom:6px">Структура расходов</div>
        ${catRows}
      </div>` : ''}
    </div>`;

  /* ── Month metrics ── */
  const mTotal = m.days_in_month || 30;
  const sleepRingColor = m.sleep_on_time_days / mTotal >= 0.7 ? 'var(--pos)'
    : m.sleep_on_time_days / mTotal >= 0.3 ? 'var(--warn)' : 'var(--crit)';
  const workColor = m.workouts >= m.workouts_goal ? 'var(--pos)' : 'var(--bordeaux)';

  const monthMetrics = `<div class="rings-grid-2x2">
    ${ring(m.sobriety_days, mTotal, '🍺', 'Трезвость', `${m.sobriety_days} / ${mTotal} дн`)}
    ${ring(m.sleep_on_time_days, mTotal, '🌙', 'Сон', `${m.sleep_on_time_days} / ${mTotal} дн`)}
    ${ring(m.workouts, m.workouts_goal, '🏃', 'Активность', `${m.workouts} / ${m.workouts_goal}`)}
    ${ring(m.intensive || 0, m.intensive_goal || 1, '🏋', 'Интенсивные', `${m.intensive || 0} / ${m.intensive_goal || '?'}`)}
  </div>`;

  /* ── Year metrics ── */
  const savedRub = y.saved_rub || 0;
  const savGoal  = y.savings_goal || 480000;
  const savedK   = Math.round(savedRub / 1000);
  const savGoalK = Math.round(savGoal / 1000);

  const yearMetrics = `<div class="rings-grid-2x2">
    ${ring(y.sobriety_days, y.sobriety_goal, '🍺', 'Трезвость', `${y.sobriety_days} / ${y.sobriety_goal} дн`)}
    ${ring(y.activity_count || 0, y.activity_goal || 365, '🏃', 'Активность', `${y.activity_count || 0} / ${y.activity_goal || 365}`)}
    ${ring(y.intensive_count, y.intensive_goal, '🏋', 'Интенсивные', `${y.intensive_count} / ${y.intensive_goal}`)}
    ${ring(savedK, savGoalK, '💰', 'Накоплено', `${savedK}к / ${savGoalK}к ₽`)}
  </div>`;

  /* ── Streak calendar ── */
  const year  = new Date().getFullYear();
  const month = new Date().getMonth();
  const firstDow = (new Date(year, month, 1).getDay() + 6) % 7; // 0=Mon

  const wdHeaders = WEEKDAYS.map(w => `<div class="cal-wd">${w}</div>`).join('');

  const blanks = Array(firstDow).fill('<div class="cal-cell cal-empty"></div>').join('');

  const dayCells = cal.map(item => {
    const soberDot = item.sober === true ? 'ok' : item.sober === false ? 'fail' : 'na';
    const sleepDot = item.sleep_ok === true ? 'ok' : item.sleep_ok === false ? 'fail' : 'na';
    return `<div class="cal-cell">
      <div class="cal-num">${item.day}</div>
      <div class="cal-dots">
        ${dot('cal-dot dot-' + soberDot)}
        ${dot('cal-dot dot-' + sleepDot)}
      </div>
    </div>`;
  }).join('');

  const calHtml = `
    <div class="card cal-card">
      <div class="section-label">Стрик — ${m.name}</div>
      <div class="cal-legend">
        <div class="cal-legend-item"><div class="legend-dot" style="background:var(--pos)"></div>🍺 трезвость</div>
        <div class="cal-legend-item"><div class="legend-dot" style="background:var(--pos)"></div>🌙 сон вовремя</div>
        <div class="cal-legend-item"><div class="legend-dot" style="background:var(--crit);opacity:.75"></div>нарушено</div>
        <div class="cal-legend-item"><div class="legend-dot" style="background:var(--line)"></div>нет данных</div>
      </div>
      <div class="cal-weekdays">${wdHeaders}</div>
      <div class="cal-grid">${blanks}${dayCells}</div>
    </div>`;

  /* ── Life goals ── */
  const goalsHtml = `
    <div class="card goals-card">
      <div class="section-label">Фокус 2026</div>
      <ul class="goals-list">
        <li class="goal-item">
          <span class="goal-icon">🎯</span>
          <span class="goal-text"><strong>Операционный директор</strong> — освоить роль полностью к концу 2026</span>
        </li>
        <li class="goal-item">
          <span class="goal-icon">🍺</span>
          <span class="goal-text"><strong>365 дней трезвости</strong> — начал 18 июня 2026</span>
        </li>
        <li class="goal-item">
          <span class="goal-icon">🏋</span>
          <span class="goal-text"><strong>200 интенсивных тренировок</strong> — strain &gt; 10</span>
        </li>
        <li class="goal-item">
          <span class="goal-icon">💰</span>
          <span class="goal-text"><strong>Накопить 480 000 ₽</strong> — 40 000 в месяц</span>
        </li>
        <li class="goal-item">
          <span class="goal-icon">👨‍👩‍👧</span>
          <span class="goal-text"><strong>Семья</strong> — качественное время с Анной и Евой</span>
        </li>
      </ul>
    </div>`;

  /* ── Assemble ── */
  document.getElementById('content').innerHTML = `
    <div class="tab-bar" id="tab-bar">
      <button class="tab-pill active" data-section="s-today">📊 Сводка</button>
      <button class="tab-pill" data-section="s-finance">💰 Финансы</button>
      <button class="tab-pill" data-section="s-sleep">🌙 Сон</button>
      <button class="tab-pill" data-section="s-month">📅 Месяц</button>
      <button class="tab-pill" data-section="s-year">📈 Год</button>
    </div>

    <section class="tab-section" id="s-today">
      <div class="section-label">Сегодня</div>
      ${whoopStrip}
      <div class="spacer"></div>
      <div class="chips">${alcChip}${sleepChip}${trainChip}${moodChip}</div>
      <div class="action-bar">
        <span class="action-arrow">→</span>
        <span class="action-text">${t.action || ''}</span>
      </div>
    </section>

    <section class="tab-section" id="s-sleep">
      ${sleepWeekHtml}
    </section>

    <section class="tab-section" id="s-finance">
      ${financeHtml}
    </section>

    <div class="bottom-grid">
      <div class="card section-card tab-section" id="s-month">
        <div class="section-label">${m.name}</div>
        ${monthMetrics}
      </div>
      <div class="card section-card tab-section" id="s-year">
        <div class="section-label">Год 2026</div>
        ${yearMetrics}
      </div>
    </div>
    ${calHtml}
    ${goalsHtml}
  `;

  /* ── Tab click + scroll spy ── */
  const tabBar = document.getElementById('tab-bar');
  if (tabBar) {
    const pills = tabBar.querySelectorAll('.tab-pill');
    pills.forEach(pill => {
      pill.addEventListener('click', () => {
        const sec = document.getElementById(pill.dataset.section);
        if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
        pills.forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
      });
    });
    const secIds = ['s-today', 's-sleep', 's-finance', 's-month', 's-year'];
    const observer = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          pills.forEach(p => p.classList.toggle('active', p.dataset.section === e.target.id));
        }
      });
    }, { rootMargin: '-10% 0px -60% 0px', threshold: 0 });
    secIds.map(id => document.getElementById(id)).filter(Boolean).forEach(s => observer.observe(s));
  }

  const gen  = new Date(d.generated_at);
  const opts = { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Moscow' };
  document.getElementById('updated').textContent = 'обновлено ' + gen.toLocaleString('ru-RU', opts);
}

fetch('data.json?v=' + Date.now())
  .then(r => r.json())
  .then(render)
  .catch(() => {
    document.getElementById('content').innerHTML = '<div class="loading">Ошибка загрузки данных</div>';
  });
</script>
</body>
</html>
